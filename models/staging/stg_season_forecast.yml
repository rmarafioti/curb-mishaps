models:
  - name: stg_season_forecast
    description: >
      Grain: one row per forecast season (13 and 14) and has_forecast_catastrophe (0 =
      everyday mishaps only, 1 = if a catastrophe hits). The season_forecast seed as
      written by scripts/forecast.py: each season's air year and episode count, the
      median and 80% range of its mishap count and total loss, the everyday medians by
      loss kind, and the chance of a catastrophe.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - has_forecast_catastrophe
    columns:
      - name: season
        data_type: int64
        description: '{{ doc("forecast_season") }}'
      - name: air_year
        data_type: int64
        description: '{{ doc("forecast_air_year") }}'
      - name: has_forecast_catastrophe
        data_type: int64
        description: '{{ doc("has_forecast_catastrophe") }}'
      - name: episodes
        data_type: int64
        description: '{{ doc("forecast_episodes") }}'
      - name: mishaps_p10
        data_type: int64
        description: '{{ doc("forecast_mishaps_p10") }}'
      - name: mishaps_median
        data_type: int64
        description: '{{ doc("forecast_mishaps_median") }}'
      - name: mishaps_p90
        data_type: int64
        description: '{{ doc("forecast_mishaps_p90") }}'
      - name: loss_p10_usd
        data_type: float64
        description: '{{ doc("forecast_loss_p10_usd") }}'
      - name: loss_median_usd
        data_type: float64
        description: '{{ doc("forecast_loss_median_usd") }}'
      - name: loss_p90_usd
        data_type: float64
        description: '{{ doc("forecast_loss_p90_usd") }}'
      - name: realized_loss_median_usd
        data_type: float64
        description: '{{ doc("forecast_realized_loss_median_usd") }}'
      - name: hypothetical_loss_median_usd
        data_type: float64
        description: '{{ doc("forecast_hypothetical_loss_median_usd") }}'
      - name: catastrophe_chance
        data_type: float64
        description: '{{ doc("catastrophe_chance") }}'
