models:
  - name: stg_ld_net_worth
    description: >
      Grain: one row per calendar year (2000-2027), keyed on year. The ld_net_worth_cpi
      seed, renamed: whether the show aired that year, net worth with the real 2007
      divorce added back (in $M), net worth basis and event, CPI and the 2026-dollars
      multiplier.
    columns:
      - name: year
        data_type: int64
        description: '{{ doc("net_worth_year") }}'
        data_tests:
          - unique
          - not_null
      - name: is_show_airing
        data_type: int64
        description: '{{ doc("is_show_airing") }}'
      - name: net_worth_adj_low_musd
        data_type: float64
        description: '{{ doc("net_worth_adj_low_musd") }}'
      - name: net_worth_adj_mid_musd
        data_type: float64
        description: '{{ doc("net_worth_adj_mid_musd") }}'
      - name: net_worth_adj_high_musd
        data_type: float64
        description: '{{ doc("net_worth_adj_high_musd") }}'
      - name: net_worth_basis
        data_type: string
        description: '{{ doc("net_worth_basis") }}'
      - name: net_worth_event
        data_type: string
        description: '{{ doc("net_worth_event") }}'
      - name: cpi_index
        data_type: float64
        description: '{{ doc("cpi_index") }}'
      - name: to_2026_dollars_multiplier
        data_type: float64
        description: '{{ doc("to_2026_dollars_multiplier") }}'
