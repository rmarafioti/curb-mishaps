models:
  - name: stg_mishaps
    description: >
      One row per Sheet row, typed and cleaned. Keeps every review status and the
      has_mishap = false placeholder rows (dim_episode needs them); filtering to
      review_status = 'keep' happens in fct_mishap.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['episode_id', 'mishap_num']
    columns:
      - name: mishap_id
        description: >
          Surrogate key on episode_id + mishap_num. Both are assigned once in the Sheet
          and never renumbered, unlike row_id.
        data_tests:
          - unique
          - not_null
      - name: mishap_num
        description: >
          Mishap number within its episode (1, 2, 3...); 0 marks a no-mishap placeholder
          row. New mishaps take the next unused number; gaps left by deleted rows stay.
        data_tests:
          - not_null
      - name: sheet_row_id
        description: Display order in the Sheet (Sheet row = sheet_row_id + 1). Not stable; never a key.
      - name: episode_id
        data_tests:
          - not_null
      - name: episode_date
        description: Air date of the episode (Sheet column air_date).
        data_tests:
          - not_null
      - name: episode_year
        description: Year parsed from episode_date; joins to dim_net_worth.year.
        data_tests:
          - not_null
      - name: loss_kind
        data_tests:
          - accepted_values:
              arguments:
                values: ['realized', 'hypothetical']
      - name: loss_kind_category
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - purchase
                  - payment
                  - gift
                  - donation
                  - investment
                  - bet
                  - loan_unrepaid
                  - fine_fee
                  - cash_lost
                  - property_damage
                  - property_lost
                  - lost_opportunity
                  - money_received   # only on dropped rows; remove once drops are deleted
      - name: mishap_source
        description: Where the mishap was found. `user` = Rich's own viewing or recollection.
        data_tests:
          - accepted_values:
              arguments:
                values: ['wikipedia', 'imdb', 'fandom', 'user', 'wikipedia+imdb', 'fandom+imdb']
      - name: review_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['keep', 'drop', 'pass', 'unsure']
      - name: confidence
        data_tests:
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high']
      - name: amount_usd
        description: Only filled when the amount is stated on screen or in a synopsis.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "amount_stated = 0"
      - name: est_mid_usd
        description: Required on every kept mishap (stated rows repeat the stated amount).
        data_tests:
          - not_null:
              config:
                where: "review_status = 'keep' and has_mishap"
      - name: is_catastrophic
        description: Divorce, house fire, Latte Larry's. Set in Sheet column X.

  - name: stg_ld_net_worth
    description: Net worth and CPI by year from the ld_net_worth_cpi seed. Amounts in $M.
    columns:
      - name: year
        data_tests:
          - unique
          - not_null
