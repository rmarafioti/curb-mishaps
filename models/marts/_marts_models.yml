models:
  - name: dim_date
    description: >
      Calendar from 2000-01-01 through 2028-12-31, one row per day. Joins to
      fct_mishap on episode_date and, through date_year, to dim_net_worth. Also
      registered as MetricFlow's time spine, which is what `metric_time` resolves to.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests:
          - unique
          - not_null
      - name: date_year
        description: Calendar year; joins to dim_net_worth.year and fct_mishap.episode_year.
      - name: year_start_date
        description: January 1 of the year.
