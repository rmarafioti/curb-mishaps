models:
  - name: dim_net_worth
    description: >
      Grain: one row per calendar year (2000-2027), keyed on year. Larry David's net
      worth (mid) with the real 2007 divorce added back, in dollars, plus the 2026-dollars
      multiplier and whether the show aired that year. Semi-additive: never sum net worth
      across years or after joining to mishaps. The semantic layer derives year_start_date
      (Jan 1 of the year) from year, to line net worth up with mishaps on
      metric_time__year. Built 1:1 from stg_ld_net_worth, where year is tested.
    columns:
      - name: year
        data_type: int64
        description: '{{ doc("net_worth_year") }}'
      - name: is_show_airing
        data_type: int64
        description: '{{ doc("is_show_airing") }}'
      - name: to_2026_dollars_multiplier
        data_type: float64
        description: '{{ doc("to_2026_dollars_multiplier") }}'
      - name: net_worth_adj_mid_usd
        data_type: float64
        description: '{{ doc("net_worth_adj_mid_usd") }}'
