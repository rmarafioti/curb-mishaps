# Every metric the dashboard, exports and AI answers use. Charts ask for these by name and
# slice by dimensions (e.g. --group-by metric_time__year, episode__season,
# mishap__loss_kind_category); no metric logic lives anywhere else.
#
# MetricFlow metric types used here:
#   simple:  one measure, optionally filtered
#   ratio:   one metric divided by another, each aggregated before dividing
#   derived: arithmetic on other metrics, computed after they are aggregated

metrics:

  # --- Losses (dollars of the year the episode aired) -------------------------------

  - name: total_mishap_loss
    label: Total Mishap Loss
    description: >
      Every kept mishap: realized + hypothetical + catastrophic. Hypothetical losses always
      count; loss_kind is only a slice.
    type: simple
    type_params:
      measure:
        name: mishap_cost
        # a year or season with no matching mishaps reads $0 / 0, not blank
        fill_nulls_with: 0

  - name: total_mishap_loss_low
    label: Total Mishap Loss (low)
    description: Low end of the total's range. Stated prices count at their price.
    type: simple
    type_params:
      measure:
        name: mishap_cost_low
        fill_nulls_with: 0

  - name: total_mishap_loss_high
    label: Total Mishap Loss (high)
    description: High end of the total's range. Stated prices count at their price.
    type: simple
    type_params:
      measure:
        name: mishap_cost_high
        fill_nulls_with: 0

  - name: realized_loss
    label: Realized
    description: Everyday money or property actually lost (catastrophic excluded).
    type: simple
    type_params:
      measure:
        name: mishap_cost
        fill_nulls_with: 0
    # Dimension('<entity>__<dimension>') names a dimension through its entity
    filter: |
      {{ Dimension('mishap__loss_kind') }} = 'realized'
      and {{ Dimension('mishap__is_catastrophic') }} = 0

  - name: hypothetical_loss
    label: Hypothetical
    description: Everyday missed income, e.g. the HBO show and the golf club (catastrophic excluded).
    type: simple
    type_params:
      measure:
        name: mishap_cost
        fill_nulls_with: 0
    filter: |
      {{ Dimension('mishap__loss_kind') }} = 'hypothetical'
      and {{ Dimension('mishap__is_catastrophic') }} = 0

  - name: catastrophic_loss
    label: Catastrophic
    description: The divorce, the house fire and Latte Larry's.
    type: simple
    type_params:
      measure:
        name: mishap_cost
        fill_nulls_with: 0
    filter: |
      {{ Dimension('mishap__is_catastrophic') }} = 1

  - name: median_mishap_cost
    label: Median Mishap Cost
    description: >
      The typical mishap: the lower median cost across the mishaps in each group of the
      query (all of them, or per year or season when grouped by one). With an even number
      of mishaps it is the lower of the middle two, not their average, so it is always a
      real mishap's cost. Each mishap is valued in dollars of the year its episode aired
      (not inflation-adjusted).
    type: simple
    type_params:
      measure: mishap_cost_median

  # --- 2026 dollars (cost trend and forecast only) -----------------------------------

  - name: total_mishap_loss_2026
    label: Total Mishap Loss (2026 $)
    description: total_mishap_loss with each mishap converted to 2026 dollars by CPI.
    type: simple
    type_params:
      measure:
        name: mishap_cost_2026
        fill_nulls_with: 0

  - name: median_routine_mishap_cost_2026
    label: Median Routine Mishap Cost (2026 $)
    description: >
      The severity trend with inflation removed: the lower median cost across the routine
      mishaps in each group (e.g. per season), each converted to 2026 dollars. With an even
      number of mishaps it is the lower of the middle two, not their average. Catastrophic mishaps
      (the divorce, the house fire, Latte Larry's) are excluded so a single outlier can't
      move a season's median; they are forecast separately as rare events.
    type: simple
    type_params:
      measure: mishap_cost_2026_median
    filter: |
      {{ Dimension('mishap__is_catastrophic') }} = 0

  # --- Counts and frequency ----------------------------------------------------------

  - name: mishap_count
    label: Mishaps
    description: Number of kept mishaps.
    type: simple
    type_params:
      measure:
        name: mishap_count
        fill_nulls_with: 0

  - name: episode_count
    label: Episodes
    description: Number of episodes, including those with no mishap.
    type: simple
    type_params:
      measure: episode_count

  - name: mishaps_per_episode
    label: Mishaps per Episode
    description: Kept mishaps / episodes. The frequency trend; no dollars, so inflation can't affect it.
    type: ratio
    type_params:
      numerator: mishap_count
      denominator: episode_count

  # --- Net worth (semi-additive: single-year only) -----------------------------------

  - name: net_worth_mid
    label: LD Net Worth
    type: simple
    description: >
      Larry David's net worth that year: the central (mid) estimate from reported figures
      (see the sources page), with the real 2007 divorce added back. Single-year only.
    type_params:
      measure: net_worth_adj_mid

  - name: pct_mishap_to_net_worth
    label: "% of Net Worth"
    description: >
      That year's total mishap loss / that year's net worth. Single-year only: query it
      grouped by metric_time__year.
    type: ratio
    type_params:
      numerator: total_mishap_loss
      denominator: net_worth_mid

  - name: net_worth_after_mishaps
    label: Net Worth After Mishaps
    description: >
      That year's net worth minus that year's total mishap loss. Single-year only: query
      it grouped by metric_time__year.
    type: derived
    type_params:
      expr: net_worth_mid - total_mishap_loss
      # derived metrics list the metrics their expr uses
      metrics:
        - name: net_worth_mid
        - name: total_mishap_loss
