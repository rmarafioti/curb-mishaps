# Every metric the dashboard, exports and AI answers use. Charts ask for these by name and
# slice by dimensions (e.g. --group-by metric_time__year, episode__season,
# mishap__loss_kind); no metric logic lives anywhere else.
#
# MetricFlow metric types used here:
#   simple:  one measure, optionally filtered
#   ratio:   one metric divided by another, each aggregated before dividing
#   derived: arithmetic on other metrics, computed after they are aggregated

metrics:

  # --- Losses (dollars of the year the episode aired) -------------------------------

  - name: total_mishap_loss
    label: Total Mishap Loss
    description: >
      Every kept mishap, realized + hypothetical + catastrophic. Hypothetical losses always
      count; loss_kind is only a slice.
    type: simple
    type_params:
      measure:
        name: mishap_cost
        # a year or season with no matching mishaps reads $0 / 0, not blank
        fill_nulls_with: 0

  - name: total_mishap_loss_low
    label: Total Mishap Loss (low)
    description: Low end of the total's range. Stated prices count at their price.
    type: simple
    type_params:
      measure:
        name: mishap_cost_low
        fill_nulls_with: 0

  - name: total_mishap_loss_high
    label: Total Mishap Loss (high)
    description: High end of the total's range. Stated prices count at their price.
    type: simple
    type_params:
      measure:
        name: mishap_cost_high
        fill_nulls_with: 0

  - name: median_mishap_cost
    label: Median Mishap Cost
    description: >
      The typical mishap: the lower median cost across the mishaps in each group of the
      query (all of them, or per year or season when grouped by one). With an even number
      of mishaps it is the lower of the middle two, not their average, so it is always a
      real mishap's cost. Each mishap is valued in dollars of the year its episode aired
      (not inflation-adjusted).
    type: simple
    type_params:
      measure: mishap_cost_median

  # --- 2026 dollars (forecast input only) ---------------------------------------------

  - name: total_mishap_loss_2026
    label: Total Mishap Loss (2026 $)
    description: total_mishap_loss with each mishap converted to 2026 dollars by CPI.
    type: simple
    type_params:
      measure:
        name: mishap_cost_2026
        fill_nulls_with: 0

  # --- Counts and frequency ----------------------------------------------------------

  - name: mishap_count
    label: Mishaps
    description: Number of kept mishaps.
    type: simple
    type_params:
      measure:
        name: mishap_count
        fill_nulls_with: 0

  - name: routine_mishap_count
    label: Everyday Mishaps
    description: >
      Kept mishaps that aren't catastrophic. The forecast's frequency input: grouped by
      episode (with episode_count), it gives every episode's count, zeros included.
    type: simple
    type_params:
      measure:
        name: mishap_count
        # an episode with no everyday mishap reads 0, not blank
        fill_nulls_with: 0
    # Dimension('<entity>__<dimension>') names a dimension through its entity
    filter: |
      {{ Dimension('mishap__is_catastrophic') }} = 0

  - name: episode_count
    label: Episodes
    description: Number of episodes, including those with no mishap.
    type: simple
    type_params:
      measure: episode_count

  # --- Net worth (semi-additive: single-year only) -----------------------------------

  - name: net_worth_mid
    label: "LD's Net Worth"
    type: simple
    description: >
      Larry David's net worth that year: the central (mid) estimate from reported figures
      (see the sources page), with the real 2007 divorce added back. Single-year only.
    type_params:
      measure: net_worth_adj_mid

  - name: pct_mishap_to_net_worth
    label: "% of Net Worth"
    description: >
      That year's total mishap loss / that year's net worth. Single-year only: query it
      grouped by metric_time__year.
    type: ratio
    type_params:
      numerator: total_mishap_loss
      denominator: net_worth_mid

  # --- Running dent: the character's losses taken out of the real net worth -------------
  # The one place mishaps are subtracted as a running total (an exception to the brief's
  # single-year rule, agreed 2026-11-20). Labeled so no one reads it as Larry David's
  # real net worth.

  - name: cumulative_mishap_loss
    label: Cumulative Financial Loss
    description: >
      Running total of every kept mishap from the first episode up to and including each
      period, in each year's own dollars.
    # cumulative: adds up the measure from the start of the data to each period of
    # metric_time, instead of summing only that period
    type: cumulative
    type_params:
      measure:
        name: mishap_cost
        fill_nulls_with: 0
      cumulative_type_params:
        # grouped by year, report the running total as of the year's last day (the
        # default, first, would leave out that year's own mishaps)
        period_agg: last

  - name: net_worth_after_mishaps_to_date
    label: Net Worth After Mishaps
    description: >
      That year's real net worth minus every mishap up to and including that year: what
      he'd have if the character's losses were real. Query it grouped by metric_time__year.
    type: derived
    type_params:
      expr: net_worth_mid - cumulative_mishap_loss
      metrics:
        - name: net_worth_mid
        - name: cumulative_mishap_loss

  # --- Forecast: Season 13 (2025) and Season 14 (2026), if the show had kept going -----
  # From scripts/forecast.py via the season_forecast seed. Two rows per season (everyday
  # only, and if a catastrophe hits), in dollars of the year each season airs. Medians and
  # percentiles don't add up: query these grouped by season_forecast__season and
  # season_forecast__has_forecast_catastrophe, never across seasons or versions.

  - name: forecast_loss_median
    label: Expected Cost
    description: >
      The season's median simulated total loss: everyday mishaps only, or plus a
      catastrophe when grouped by has_forecast_catastrophe = 1. Half the simulated seasons
      cost less, half more. In dollars of the year it airs.
    type: simple
    type_params:
      measure: forecast_loss_median

  - name: forecast_loss_p10
    label: Low End
    description: >
      10th percentile of the season's simulated total loss: 1 in 10 simulated seasons cost
      less. With the high end, the 80% range.
    type: simple
    type_params:
      measure: forecast_loss_p10

  - name: forecast_loss_p90
    label: High End
    description: >
      90th percentile of the season's simulated total loss: 1 in 10 simulated seasons cost
      more. With the low end, the 80% range.
    type: simple
    type_params:
      measure: forecast_loss_p90

  - name: forecast_mishaps_median
    label: Expected Mishaps
    description: The season's median simulated number of everyday mishaps.
    type: simple
    type_params:
      measure: forecast_mishaps_median

  - name: forecast_mishaps_p10
    label: Mishaps (low end)
    description: 10th percentile of the season's simulated everyday mishap count.
    type: simple
    type_params:
      measure: forecast_mishaps_p10

  - name: forecast_mishaps_p90
    label: Mishaps (high end)
    description: 90th percentile of the season's simulated everyday mishap count.
    type: simple
    type_params:
      measure: forecast_mishaps_p90

  - name: forecast_catastrophe_chance
    label: Chance of a Catastrophe
    description: >
      Chance the season has a catastrophe that could happen again (the house fire or Latte
      Larry's): the share of the 12 real seasons that had one. The divorce is left out:
      it was the show's one divorce, and Larry ends the series unmarried.
    type: simple
    type_params:
      measure: forecast_catastrophe_chance

  - name: forecast_episodes
    label: Forecast Episodes
    description: Episodes in the forecast season (10, like every real season).
    type: simple
    type_params:
      measure: forecast_episodes
