models:
  - name: fct_season_forecast
    description: >
      Grain: one row per forecast season (13 and 14) and has_forecast_catastrophe (0 =
      everyday mishaps only, 1 = if a catastrophe hits), keyed on season_forecast_key. The
      forecast's output: each version's median and 80% range (10th to 90th percentile) of
      mishap count and total loss in dollars of the year it airs, the everyday medians by
      loss kind and the chance of a catastrophe. Medians and percentiles are not additive:
      never sum them across seasons or versions. Built 1:1 from stg_season_forecast, where
      the grain is tested.
    columns:
      - name: season_forecast_key
        data_type: string
        description: '{{ doc("season_forecast_key") }}'
      - name: season
        data_type: int64
        description: '{{ doc("forecast_season") }}'
      - name: air_year
        data_type: int64
        description: '{{ doc("forecast_air_year") }}'
      - name: has_forecast_catastrophe
        data_type: int64
        description: '{{ doc("has_forecast_catastrophe") }}'
      - name: episodes
        data_type: int64
        description: '{{ doc("forecast_episodes") }}'
      - name: mishaps_p10
        data_type: int64
        description: '{{ doc("forecast_mishaps_p10") }}'
      - name: mishaps_median
        data_type: int64
        description: '{{ doc("forecast_mishaps_median") }}'
      - name: mishaps_p90
        data_type: int64
        description: '{{ doc("forecast_mishaps_p90") }}'
      - name: loss_p10_usd
        data_type: float64
        description: '{{ doc("forecast_loss_p10_usd") }}'
      - name: loss_median_usd
        data_type: float64
        description: '{{ doc("forecast_loss_median_usd") }}'
      - name: loss_p90_usd
        data_type: float64
        description: '{{ doc("forecast_loss_p90_usd") }}'
      - name: catastrophe_chance
        data_type: float64
        description: '{{ doc("catastrophe_chance") }}'
