semantic_models:

  - name: mishaps
    description: >
      Grain: one row per kept mishap (fct_mishap). Costs are in dollars of the year the
      episode aired; mishap_cost_2026 is the CPI-adjusted copy for the trend and forecast.
    model: ref('fct_mishap')
    defaults:
      # the date MetricFlow puts these measures on when a query asks for metric_time
      agg_time_dimension: episode_date
    # entities are the join keys: MetricFlow joins semantic models that share an
    # entity name, so no join is ever written by hand
    entities:
      - name: mishap
        # primary: one row per mishap_key in this table
        type: primary
        expr: mishap_key
      - name: episode
        # foreign: many mishaps per episode; reaches season etc. in the episodes model
        type: foreign
        expr: episode_id
      # not `year`: MetricFlow reserves time granularity names (day, month, year...)
      - name: calendar_year
        # foreign: many mishaps per year; reaches is_show_airing in the net_worth model
        type: foreign
        expr: episode_year
    dimensions:
      - name: episode_date
        type: time
        type_params:
          # the column's own grain; MetricFlow rolls it up to month, quarter, year
          time_granularity: day
      - name: loss_kind
        type: categorical
      - name: loss_kind_category
        type: categorical
      - name: is_catastrophic
        type: categorical
      - name: amount_stated
        type: categorical
      - name: confidence
        type: categorical
      - name: description
        type: categorical
      - name: estimate_basis
        type: categorical
    # measures are the aggregations metrics are built from; a measure alone is not
    # queryable, only metrics are
    measures:
      - name: mishap_cost
        agg: sum
      - name: mishap_cost_low
        agg: sum
      - name: mishap_cost_high
        agg: sum
      - name: mishap_cost_2026
        agg: sum
      - name: mishap_count
        agg: count
        expr: mishap_key
      - name: mishap_cost_median
        # BigQuery has no exact median aggregate. The approximate one returns the lower
        # median: with an even count, the lower of the middle two values, not their average
        agg: percentile
        expr: mishap_cost
        agg_params:
          percentile: 0.5
          use_approximate_percentile: true
      - name: mishap_cost_2026_median
        agg: percentile
        expr: mishap_cost_2026
        agg_params:
          percentile: 0.5
          use_approximate_percentile: true

  - name: episodes
    description: >
      Grain: one row per episode (dim_episode), including episodes with no mishap.
      The denominator for Mishaps per Episode, and the home of season.
    model: ref('dim_episode')
    defaults:
      agg_time_dimension: episode_date
    entities:
      - name: episode
        type: primary
        expr: episode_id
    dimensions:
      - name: episode_date
        type: time
        type_params:
          time_granularity: day
      - name: season
        type: categorical
      - name: episode_in_season
        type: categorical
      - name: episode_title
        type: categorical
    measures:
      - name: episode_count
        agg: count
        expr: episode_id

  - name: net_worth
    description: >
      Grain: one row per year (dim_net_worth), 2000-2027. Larry David's net worth with the
      real 2007 divorce added back, in dollars. Semi-additive: never summed across years.
    model: ref('dim_net_worth')
    defaults:
      agg_time_dimension: year_start_date
    entities:
      - name: calendar_year
        type: primary
        expr: year
    dimensions:
      - name: year_start_date
        type: time
        # not a column: MetricFlow needs a date (not an int year) to put net worth on
        # metric_time. Jan 1 lines up with mishaps grouped by metric_time__year
        expr: date(year, 1, 1)
        type_params:
          time_granularity: year
      - name: is_show_airing
        type: categorical
    measures:
      - name: net_worth_adj_mid
        agg: sum
        expr: net_worth_adj_mid_usd
        # semi-additive: across several years, take the latest year's value instead of
        # summing them (a balance, not a flow)
        non_additive_dimension:
          name: year_start_date
          window_choice: max

  - name: season_forecast
    description: >
      Grain: one row per forecast season and version (fct_season_forecast): Season 13 in
      2025 and Season 14 in 2026, each with everyday mishaps only and if a catastrophe
      hits. Medians and percentiles from scripts/forecast.py, in dollars of the year each
      season airs. Not additive: query grouped by season and has_forecast_catastrophe,
      never summed.
    model: ref('fct_season_forecast')
    defaults:
      agg_time_dimension: air_year_start_date
    entities:
      - name: season_forecast
        # primary: one row per season_forecast_key (season + version)
        type: primary
        expr: season_forecast_key
    dimensions:
      - name: season
        type: categorical
      # the filter: 0 = everyday mishaps only, 1 = if a catastrophe hits
      - name: has_forecast_catastrophe
        type: categorical
      - name: air_year_start_date
        type: time
        # not a column: like net worth, a date for the year so the forecast sits on
        # metric_time__year next to the real seasons
        expr: date(air_year, 1, 1)
        type_params:
          time_granularity: year
    # one row per season and version, so each sum is that row's own value once grouped by both
    measures:
      - name: forecast_episodes
        agg: sum
        expr: episodes
      - name: forecast_mishaps_p10
        agg: sum
        expr: mishaps_p10
      - name: forecast_mishaps_median
        agg: sum
        expr: mishaps_median
      - name: forecast_mishaps_p90
        agg: sum
        expr: mishaps_p90
      - name: forecast_loss_p10
        agg: sum
        expr: loss_p10_usd
      - name: forecast_loss_median
        agg: sum
        expr: loss_median_usd
      - name: forecast_loss_p90
        agg: sum
        expr: loss_p90_usd
      - name: forecast_realized_loss_median
        agg: sum
        expr: realized_loss_median_usd
      - name: forecast_hypothetical_loss_median
        agg: sum
        expr: hypothetical_loss_median_usd
      - name: forecast_catastrophe_chance
        agg: sum
        expr: catastrophe_chance
