models:
  - name: fct_mishap
    description: >
      Grain: one row per kept mishap, keyed on mishap_key (episode_id + mishap_num).
      Only review_status = 'keep' rows with has_mishap = 1. Costs are in dollars of the year
      the episode aired; mishap_cost_2026 is the CPI-adjusted copy. Metrics on this table live
      only in MetricFlow YAML. Completeness (every kept row, realized and hypothetical,
      reaches this table) is tested in tests/assert_fct_mishap_keeps_every_loss_kind.sql.
      The grain is tested in stg_mishaps; this model only filters those rows.
    columns:
      - name: mishap_key
        data_type: string
        description: '{{ doc("mishap_key") }}'
      - name: episode_id
        data_type: int64
        description: '{{ doc("episode_id") }}'
      - name: mishap_num
        data_type: int64
        description: '{{ doc("mishap_num") }}'
      - name: episode_date
        data_type: date
        description: '{{ doc("episode_date") }}'
      - name: episode_year
        data_type: int64
        description: '{{ doc("episode_year") }}'
      - name: description
        data_type: string
        description: '{{ doc("mishap_description") }}'
      - name: loss_kind
        data_type: string
        description: '{{ doc("loss_kind") }}'
      - name: loss_kind_category
        data_type: string
        description: '{{ doc("loss_kind_category") }}'
      - name: is_catastrophic
        data_type: int64
        description: '{{ doc("is_catastrophic") }}'
      - name: mishap_source
        data_type: string
        description: '{{ doc("mishap_source") }}'
      - name: amount_stated
        data_type: int64
        description: '{{ doc("amount_stated") }}'
      - name: amount_usd
        data_type: float64
        description: '{{ doc("amount_usd") }}'
      - name: est_low_usd
        data_type: float64
        description: '{{ doc("est_low_usd") }}'
      - name: est_mid_usd
        data_type: float64
        description: '{{ doc("est_mid_usd") }}'
      - name: est_high_usd
        data_type: float64
        description: '{{ doc("est_high_usd") }}'
      - name: estimate_basis
        data_type: string
        description: '{{ doc("estimate_basis") }}'
      - name: confidence
        data_type: string
        description: '{{ doc("confidence") }}'
      - name: mishap_cost
        data_type: float64
        description: '{{ doc("mishap_cost") }}'
        data_tests:
          - not_null
      - name: mishap_cost_2026
        data_type: float64
        description: '{{ doc("mishap_cost_2026") }}'
